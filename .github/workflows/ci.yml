name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # verify = unit tests + ArchUnit + JaCoCo check (>= 90 % line coverage per module).
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Docker image + vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          tags: reactive-ticketing-platform:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: reactive-ticketing-platform:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform fmt / validate / tflint / Checkov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - run: terraform fmt -recursive -check
      - name: terraform validate (no backend, no credentials)
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --config "$(pwd)/.tflint.hcl"
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: true   # report-only until the baseline is reviewed

  smoke:
    name: Smoke test (docker compose + Postman/Newman)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          echo "TICKETING_SECURITY_LOCAL_JWT_SECRET=$(openssl rand -hex 32)" > .env
          echo "COMPOSE_PROFILES=localstack" >> .env
          docker compose up -d --build --wait --wait-timeout 300 ticketing-api ticketing-worker
      - name: Run the Postman collection
        run: |
          secret=$(grep TICKETING_SECURITY_LOCAL_JWT_SECRET .env | cut -d= -f2)
          npx --yes newman@6 run postman/reactive-ticketing.postman_collection.json \
            --env-var "jwtSecret=$secret" --delay-request 300 --timeout-request 20000 \
            --folder "0. Health" --folder "1. Events (admin)" --folder "2. Purchase flow" \
            --folder "3. Cancellation" --folder "4. Negative & security cases"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
